<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    background: url("background.jpg") center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

/* Dark overlay */
body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
}

.book {
    position: relative;
    width: 320px;
    height: 420px;
    perspective: 1500px;
    z-index: 1;
}

.page {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    transform-origin: left;
    transition: transform 1s;
    padding: 30px;
    box-sizing: border-box;
}

.page h2 {
    margin-top: 0;
    color: #ff4e8b;
}

.page p {
    font-size: 14px;
    line-height: 1.6;
    color: #333;
}

.page.flipped {
    transform: rotateY(-180deg);
}

button {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 8px 15px;
    border: none;
    background: #ff4e8b;
    color: white;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="book">

    <div class="page" id="page1">
        <h2>Page 1 ❤️</h2>
        <p>
            The day I met you,<br>
            my world changed forever.<br><br>
            You became my smile,
            my peace, my happiness.
        </p>
        <button onclick="flipPage('page1')">Next ➜</button>
    </div>

    <div class="page" id="page2">
        <h2>Page 2 💕</h2>
        <p>
            Every moment with you<br>
            feels magical and warm.<br><br>
            Your love is my favorite place.
        </p>
        <button onclick="flipPage('page2')">Next ➜</button>
    </div>

    <div class="page" id="page3">
        <h2>Page 3 💌</h2>
        <p>
            I promise to love you,<br>
            support you,<br>
            and stay by your side forever.<br><br>
            Happy Valentine's Day ❤️
        </p>
        <button onclick="flipPage('page3')">Close Book</button>
    </div>

</div>

<script>
function flipPage(pageId) {
    document.getElementById(pageId).classList.add("flipped");
}
</script>

</body>
</html>
