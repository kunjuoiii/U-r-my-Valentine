<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U R My Valentine ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    background: url("background.jpg") no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    color: white;
}

/* Dark Overlay */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
}

/* Glass Card */
.card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    padding: 40px;
    width: 380px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    animation: fadeIn 2s ease-in-out;
}

h1 {
    font-size: 28px;
    margin-bottom: 15px;
}

p {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 20px;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(45deg, #ff4e8b, #ff6fa5);
    color: white;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 15px #ff4e8b;
}

.hidden-message {
    display: none;
    margin-top: 20px;
    font-size: 18px;
    font-weight: 600;
    animation: fadeIn 1.5s ease-in-out;
}

/* Floating Hearts */
.heart {
    position: absolute;
    bottom: -20px;
    font-size: 22px;
    color: #ffccd9;
    animation: floatUp linear infinite;
    opacity: 0.8;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="card">
    <h1>Happy Valentine's Day ❤️</h1>
    <p>
        To the most beautiful girl in my life,<br>
        Every moment with you feels magical.<br>
        You are my today, my tomorrow,<br>
        and my forever 💖
    </p>

    <button onclick="showLove()">Open My Heart 💌</button>

    <div class="hidden-message" id="loveText">
        I love you more than yesterday,<br>
        but less than tomorrow ❤️
    </div>
</div>

<script>
function showLove() {
    document.getElementById("loveText").style.display = "block";
}

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
